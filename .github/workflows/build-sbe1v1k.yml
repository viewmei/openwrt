name: Build OpenWrt SBE1V1K

on:
  push:
    branches:
      - sbe1v1k
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev \
            libssl-dev python3 python3-dev rsync \
            subversion swig unzip wget zlib1g-dev \
            libusb-dev libusb-1.0-0-dev libftdi1-dev \
            mtd-utils u-boot-tools device-tree-compiler

      - name: Fetch OpenWrt source from upstream
        run: |
          echo "Fetching OpenWrt SBE1V1K branch from andrewjlamarche..."
          git remote add upstream https://github.com/andrewjlamarche/openwrt.git || true
          git fetch upstream sbe1v1k:upstream-sbe1v1k
          git checkout upstream-sbe1v1k
          echo "=== OpenWrt source fetched ==="
          git log -1 --pretty=format:"%h - %s (%an, %ar)"
          echo ""
          df -h

      - name: Prepare build environment
        run: |
          mkdir -p ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
          echo "CCACHE_HARDLINK=1" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Cache dl directory
        uses: actions/cache@v3
        with:
          path: dl
          key: dl-${{ hashFiles('.github/workflows/build-sbe1v1k.yml') }}
          restore-keys: dl-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create .config for SBE1V1K
        run: |
          cat > .config << 'EOF'
          # Target configuration
          CONFIG_TARGET_qualcommbe=y
          CONFIG_TARGET_qualcommbe_ipq95xx=y
          CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y
          
          # Kernel configuration
          CONFIG_KERNEL_NVMEM_BLOCK=y
          
          # Network/Ethernet drivers
          CONFIG_PACKAGE_kmod-phy-realtek=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          
          # WiFi/Wireless - CRITICAL PACKAGES
          CONFIG_PACKAGE_ath12k-firmware-qcn9274=y
          CONFIG_PACKAGE_kmod-ath12k=y
          CONFIG_PACKAGE_ipq-wifi-askey_sbe1v1k=y
          CONFIG_PACKAGE_wpad-openssl=y
          
          # BDF/Calibration data - MUST HAVE for WiFi
          CONFIG_ATH12K_MEM_PROFILE_512M=y
          
          # Firmware
          CONFIG_PACKAGE_rtl826x-firmware=y
          
          # Filesystem tools
          CONFIG_PACKAGE_f2fsck=y
          CONFIG_PACKAGE_mkf2fs=y
          
          # Hardware monitoring
          CONFIG_PACKAGE_kmod-hwmon-pwmfan=y
          
          # LuCI - Web Interface (Base)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-system=y
          
          # LuCI - Theme
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          
          # LuCI - Protocols
          CONFIG_PACKAGE_luci-proto-relay=y
          CONFIG_PACKAGE_luci-proto-vpnc=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          
          # LuCI - Applications
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          
          # Firewall & Security
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          
          # Utilities
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_patch=y
          CONFIG_PACKAGE_uci=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          EOF
          echo "=== .config created ==="
          tail -20 .config

      - name: Generate build config
        run: |
          make defconfig
          echo "=== Build configuration validated ==="

      - name: Download sources
        run: |
          echo "Starting download phase..."
          make download V=s -j4 2>&1 | tail -20
        continue-on-error: true

      - name: Show ccache stats before build
        run: ccache -s

      - name: Build firmware
        run: |
          echo "Build started: $(date)"
          echo "Available cores: $(nproc)"
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "Build completed: $(date)"
        timeout-minutes: 400

      - name: Show ccache stats after build
        run: ccache -s

      - name: Check build results
        if: always()
        run: |
          echo "=== Checking build output ==="
          if [ -d "bin/targets/qualcommbe/ipq95xx" ]; then
            echo "✓ Build directory found"
            ls -lh bin/targets/qualcommbe/ipq95xx/
            echo ""
            echo "=== Checking for WiFi firmware files ==="
            find bin -path "*/lib/firmware/ath12k*" -type f 2>/dev/null | head -20
          else
            echo "✗ Build directory NOT found"
            find bin -type d -name "*ipq*" 2>/dev/null
          fi

      - name: Prepare firmware release
        if: success()
        run: |
          set -e
          mkdir -p firmware-release
          
          if [ ! -d "bin/targets/qualcommbe/ipq95xx" ]; then
            echo "ERROR: bin/targets/qualcommbe/ipq95xx not found!"
            exit 1
          fi
          
          echo "Copying firmware files..."
          find bin/targets/qualcommbe/ipq95xx -type f -exec cp {} firmware-release/ \;
          
          echo "Checking firmware package contents..."
          for f in firmware-release/*; do
            if file "$f" | grep -q "gzip"; then
              echo "Extracting firmware from: $(basename $f)"
              tar -tzf "$f" | grep -i "ath12k.*board\|ath12k.*cal" | head -10 || true
            fi
          done
          
          if [ -z "$(find firmware-release -type f 2>/dev/null)" ]; then
            echo "ERROR: No firmware files copied!"
            exit 1
          fi
          
          cd firmware-release
          echo "=== Firmware files ready ==="
          ls -lh
          sha256sum * > SHA256SUMS
          echo ""
          echo "=== SHA256 checksums ==="
          cat SHA256SUMS

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sbe1v1k-firmware-${{ github.run_number }}
          path: firmware-release/
          retention-days: 60
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Build status report
        if: always()
        run: |
          echo "=== Build Status Report ==="
          if [ -f firmware-release/SHA256SUMS ]; then
            echo "✅ SUCCESS: Firmware built successfully!"
            echo "Artifacts created:"
            ls -1 firmware-release/
          else
            echo "❌ FAILED: Build did not produce expected output"
            echo "Last 100 lines of build log:"
            tail -100 build.log || true
          fi
