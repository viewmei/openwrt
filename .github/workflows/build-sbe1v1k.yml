name: Build OpenWrt SBE1V1K

on:
  push:
    branches:
      - sbe1v1k
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev \
            libssl-dev python3 python3-dev rsync \
            subversion swig unzip wget zlib1g-dev

      - name: Fetch OpenWrt source from upstream
        run: |
          git remote add upstream https://github.com/andrewjlamarche/openwrt.git || true
          git fetch upstream sbe1v1k
          git reset --hard upstream/sbe1v1k
          echo "OpenWrt source fetched successfully"
          ls -la | head -20

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create .config for SBE1V1K
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommbe=y
          CONFIG_TARGET_qualcommbe_ipq95xx=y
          CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y
          CONFIG_PACKAGE_ath12k-firmware-qcn9274=y
          CONFIG_PACKAGE_kmod-ath12k=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          EOF

      - name: Generate build config
        run: make defconfig

      - name: Download sources
        run: make download V=s
        continue-on-error: true

      - name: Build firmware
        run: make -j$(nproc) V=s
        timeout-minutes: 360

      - name: Prepare firmware
        run: |
          mkdir -p firmware-release
          echo "=== Checking build output ==="
          if [ -d "bin/targets/qualcommbe/ipq95xx" ]; then
            echo "Found build directory, listing contents:"
            ls -lh bin/targets/qualcommbe/ipq95xx/
            find bin/targets/qualcommbe/ipq95xx -type f -exec cp {} firmware-release/ \;
          else
            echo "Build directory not found at bin/targets/qualcommbe/ipq95xx"
            find bin -type f -name "*" 2>/dev/null | head -20
          fi
          
          if [ -n "$(find firmware-release -type f 2>/dev/null)" ]; then
            cd firmware-release
            sha256sum * > SHA256SUMS 2>/dev/null || true
            echo "=== Firmware files ready ==="
            ls -lh
          else
            echo "No firmware files found"
          fi

      - name: Commit and push firmware
        run: |
          git config user.email "action@github.com"
          git config user.name "Build Action"
          mkdir -p releases/sbe1v1k/$(date +%Y-%m-%d)
          if [ -n "$(find firmware-release -type f 2>/dev/null)" ]; then
            cp -v firmware-release/* releases/sbe1v1k/$(date +%Y-%m-%d)/ 2>/dev/null || true
          fi
          git add releases/
          git commit -m "Build: SBE1V1K firmware $(date +%Y-%m-%d_%H-%M-%S)" || echo "No changes to commit"
          git push origin sbe1v1k || echo "Push failed or no changes"
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbe1v1k-firmware-$(date +%Y-%m-%d)
          path: firmware-release/
          retention-days: 30
        continue-on-error: true