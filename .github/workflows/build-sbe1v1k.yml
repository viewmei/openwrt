name: Build OpenWrt SBE1V1K

on:
  push:
    branches:
      - sbe1v1k
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev \
            libssl-dev python3 python3-dev rsync \
            subversion swig unzip wget zlib1g-dev \
            libusb-dev libusb-1.0-0-dev libftdi1-dev \
            mtd-utils u-boot-tools device-tree-compiler

      - name: Fetch OpenWrt source from upstream
        run: |
          git remote add upstream https://github.com/andrewjlamarche/openwrt.git || true
          git fetch upstream sbe1v1k:upstream-sbe1v1k --depth=1
          git checkout upstream-sbe1v1k
          echo "=== OpenWrt source fetched successfully ==="
          git log -1 --oneline
          git remote -v
          df -h

      - name: Prepare cache directories
        run: |
          mkdir -p ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
          echo "CCACHE_HARDLINK=1" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Cache dl directory
        uses: actions/cache@v3
        with:
          path: dl
          key: dl-${{ hashFiles('.github/workflows/build-sbe1v1k.yml') }}
          restore-keys: dl-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p kenzo

      - name: Create .config for SBE1V1K
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommbe=y
          CONFIG_TARGET_qualcommbe_ipq95xx=y
          CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y
          CONFIG_KERNEL_NVMEM_BLOCK=y
          CONFIG_PACKAGE_ath12k-firmware-qcn6214=y
          CONFIG_PACKAGE_ath12k-firmware-qcn9274=y
          CONFIG_PACKAGE_kmod-ath12k=y
          CONFIG_PACKAGE_kmod-hwmon-pwmfan=y
          CONFIG_PACKAGE_kmod-phy-realtek=y
          CONFIG_PACKAGE_ipq-wifi-askey_sbe1v1k=y
          CONFIG_PACKAGE_rtl8261n-firmware=y
          CONFIG_PACKAGE_f2fsck=y
          CONFIG_PACKAGE_mkf2fs=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_patch=y
          CONFIG_PACKAGE_uci=y
          EOF

      - name: Generate build config
        run: |
          make defconfig
          echo "=== Final .config ==="
          tail -20 .config

      - name: Download sources
        run: |
          make download V=s -j4
          find dl -type f -exec ls -lh {} \; | wc -l
        continue-on-error: true

      - name: Show ccache stats before build
        run: ccache -s

      - name: Build firmware
        run: |
          echo "Starting build with $(nproc) cores..."
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "Build completed"
        timeout-minutes: 400

      - name: Show ccache stats after build
        run: ccache -s

      - name: Check build output
        if: always()
        run: |
          echo "=== Build output directory structure ==="
          find bin -type d | head -20
          echo "=== Checking for firmware files ==="
          find bin -type f \( -name "*.bin" -o -name "*.itb" -o -name "*.squashfs" \) -ls
          echo "=== Available images ==="
          ls -lh bin/targets/qualcommbe/ipq95xx/ 2>/dev/null || echo "Directory not found"

      - name: Prepare firmware release
        if: success()
        run: |
          mkdir -p firmware-release
          BUILD_DATE=$(date +%Y-%m-%d)
          BUILD_TIME=$(date +%H-%M-%S)
          
          if [ -d "bin/targets/qualcommbe/ipq95xx" ]; then
            echo "Copying firmware files..."
            find bin/targets/qualcommbe/ipq95xx -type f -exec cp {} firmware-release/ \;
            
            if [ -n "$(find firmware-release -type f 2>/dev/null)" ]; then
              cd firmware-release
              ls -lh
              sha256sum * > SHA256SUMS
              echo "=== Release created on $BUILD_DATE $BUILD_TIME ==="
              cat SHA256SUMS
            fi
          else
            echo "ERROR: bin/targets/qualcommbe/ipq95xx not found"
            exit 1
          fi

      - name: Create release and upload
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: firmware-${{ github.run_id }}
          release_name: SBE1V1K Firmware Build ${{ github.run_id }}
          draft: false
          prerelease: false
        continue-on-error: true

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sbe1v1k-firmware-${{ github.run_number }}
          path: firmware-release/
          retention-days: 60
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment on build status
        if: always()
        run: |
          if [ -f firmware-release/SHA256SUMS ]; then
            echo "✅ Build completed successfully!"
            echo "Firmware ready in artifacts"
          else
            echo "❌ Build failed or no firmware generated"
            tail -50 build.log || true
          fi
